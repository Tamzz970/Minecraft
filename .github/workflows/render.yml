name: render-rain-calm
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "Jumlah potongan paralel (lebih banyak = lebih cepat, total menit sama)"
        default: "6"
env:
  COMP: RainCalm
  TOTAL: "1353"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: echo "idx=$(python3 -c "print(list(range(int('${{ inputs.chunks }}'))))")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Render potongan
        run: |
          N=${{ inputs.chunks }}
          S=$(( (TOTAL + N - 1) / N ))
          A=$(( ${{ matrix.i }} * S ))
          B=$(( A + S - 1 ))
          [ $B -ge $TOTAL ] && B=$(( TOTAL - 1 ))
          echo "frames $A-$B"
          npx remotion render "$COMP" "../chunk-${{ matrix.i }}.mp4" --frames="$A-$B" --gl=swangle --concurrency=$(nproc) --codec=h264 --crf=18
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: chunk-${{ matrix.i }}.mp4
          retention-days: 3
  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: chunk-*
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Gabung potongan video + audio
        run: |
          cd parts
          for f in $(ls chunk-*.mp4 | sort -V); do echo "file '$f'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v copy -c:a aac -b:a 192k ../rain-calm-final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: rain-calm-final
          path: rain-calm-final.mp4
          retention-days: 14
