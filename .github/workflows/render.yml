name: render
# Renders the video on GitHub's servers (Remotion, CPU/swangle), split into parallel chunks, then stitches + muxes audio.
# Start it from the Actions tab, with `gh workflow run render.yml`, or via tools/termux/render.sh. Empty inputs fall back to render-config.json.
on:
  workflow_dispatch:
    inputs:
      comp:   { description: "Composition id (e.g. NvidiaV4)", required: false, default: "" }
      video:  { description: "Folder name under 02-videos (used for the output file name)", required: false, default: "" }
      chunks: { description: "Parallel render jobs (1-12)", required: false, default: "" }

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      comp: ${{ steps.p.outputs.comp }}
      video: ${{ steps.p.outputs.video }}
      frames: ${{ steps.p.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          set -e
          cfg() { jq -r ".$1 // empty" render-config.json; }
          COMP="${{ inputs.comp }}";   [ -n "$COMP" ]   || COMP=$(cfg comp)
          VIDEO="${{ inputs.video }}"; [ -n "$VIDEO" ]  || VIDEO=$(cfg video)
          CH="${{ inputs.chunks }}";   [ -n "$CH" ]     || CH=$(cfg chunks); [ -n "$CH" ] || CH=6
          [ "$CH" -gt 12 ] && CH=12
          AUD=engine/public/mix.wav; [ -f "$AUD" ] || AUD=engine/public/voice.wav
          DUR=$(python3 -c "import wave,sys; w=wave.open(sys.argv[1]); print(w.getnframes()/w.getframerate())" "$AUD")
          FRAMES=$(python3 -c "import math,sys; print(math.ceil(float(sys.argv[1])*30))" "$DUR")
          echo "comp=$COMP video=$VIDEO chunks=$CH audio=$AUD ${DUR}s => $FRAMES frames"
          echo "matrix=$(python3 tools/github/plan_chunks.py "$FRAMES" "$CH")" >> "$GITHUB_OUTPUT"
          echo "comp=$COMP" >> "$GITHUB_OUTPUT"; echo "video=$VIDEO" >> "$GITHUB_OUTPUT"; echo "frames=$FRAMES" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: engine/package-lock.json }
      - name: Chrome libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libpango-1.0-0 libcairo2 fonts-liberation ffmpeg
      - run: cd engine && npm ci --no-audit --no-fund
      - name: Render frames ${{ matrix.a }}-${{ matrix.b }}
        run: |
          cd engine && mkdir -p out
          npx remotion browser ensure || true
          npx remotion render "${{ needs.plan.outputs.comp }}" "out/chunk-${{ matrix.n }}.mp4" --frames=${{ matrix.a }}-${{ matrix.b }} --gl=swangle --concurrency=$(nproc) --muted --log=error
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.n }}", path: "engine/out/chunk-${{ matrix.n }}.mp4", retention-days: 3 }

  finish:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "chunk-*", path: chunks, merge-multiple: true }
      - name: Stitch + mux
        run: |
          set -e
          NAME="Stick3D-${{ needs.plan.outputs.video }}"
          ls chunks; for f in $(ls chunks/chunk-*.mp4 | sort); do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy "$NAME-silent.mp4"
          AUD=engine/public/mix.wav; [ -f "$AUD" ] || AUD=engine/public/voice.wav
          bash tools/remux.sh "$NAME-silent.mp4" "$AUD" "$NAME.mp4"
          F=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$NAME-silent.mp4" | tr -dc 0-9)
          echo "frames in stitched video: $F (expected ${{ needs.plan.outputs.frames }})"
          [ "$F" = "${{ needs.plan.outputs.frames }}" ]
          mkdir -p out && mv "$NAME.mp4" "$NAME-silent.mp4" out/
      - uses: actions/upload-artifact@v4
        with: { name: final-mp4, path: "out/*.mp4", retention-days: 14 }
