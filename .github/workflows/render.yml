name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      composition:
        description: "ID Komposisi (Octopus, NvidiaV4, RatTails, Main)"
        required: true
        default: "Octopus"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: engine
        run: npm install
      - name: Render video
        working-directory: engine
        run: |
          ENTRY=$([ -f src/index.ts ] && echo src/index.ts || echo src/Root.tsx)
          COMP="${{ github.event.inputs.composition || 'Octopus' }}"
          npx remotion render "$ENTRY" "$COMP" "out/${COMP}.mp4"
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition || 'Octopus' }}-video
          path: engine/out/*.mp4
