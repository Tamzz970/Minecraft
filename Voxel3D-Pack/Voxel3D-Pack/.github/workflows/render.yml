name: render
on:
  workflow_dispatch:
    inputs:
      comp:
        description: "Id komposisi (kosongkan = 'active' di engine/video.config.json)"
        default: ""
      chunks:
        description: "Jumlah potongan paralel (lebih banyak = lebih cepat; total menit hampir sama)"
        default: "6"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      comp: ${{ steps.m.outputs.comp }}
      frames: ${{ steps.m.outputs.frames }}
      audio: ${{ steps.m.outputs.audio }}
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          C="${{ inputs.comp }}"; [ -z "$C" ] && C=$(jq -r .active engine/video.config.json)
          F=$(jq -r ".videos[\"$C\"].frames" engine/video.config.json); A=$(jq -r ".videos[\"$C\"].audio // \"\"" engine/video.config.json)
          [ "$F" = "null" ] && { echo "Komposisi $C tidak ada di engine/video.config.json"; exit 1; }
          echo "comp=$C" >> $GITHUB_OUTPUT; echo "frames=$F" >> $GITHUB_OUTPUT; echo "audio=$A" >> $GITHUB_OUTPUT
          echo "idx=$(python3 -c "print(list(range(int('${{ inputs.chunks }}'))))")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: engine/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Render potongan
        run: |
          T=${{ needs.plan.outputs.frames }}; N=${{ inputs.chunks }}; S=$(( (T + N - 1) / N )); A=$(( ${{ matrix.i }} * S )); B=$(( A + S - 1 )); [ $B -ge $T ] && B=$(( T - 1 ))
          if [ $A -ge $T ]; then echo "potongan kosong"; exit 0; fi
          echo "frames $A-$B"
          npx remotion render ${{ needs.plan.outputs.comp }} ../chunk-${{ matrix.i }}.mp4 --frames=$A-$B --gl=swangle --concurrency=$(nproc) --muted --codec=h264 --crf=18
      - uses: actions/upload-artifact@v4
        with: { name: chunk-${{ matrix.i }}, path: chunk-${{ matrix.i }}.mp4, retention-days: 3, if-no-files-found: ignore }
  join:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "chunk-*", merge-multiple: true }
      - name: Gabung dan pasang suara
        run: |
          cd parts; for f in $(ls chunk-*.mp4 | sort -V); do echo "file '$f'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy video.mp4; cd ..
          OUT="${{ needs.plan.outputs.comp }}.mp4"; AU="${{ needs.plan.outputs.audio }}"
          if [ -n "$AU" ] && [ -f "$AU" ]; then ffmpeg -y -i parts/video.mp4 -i "$AU" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "$OUT"; else cp parts/video.mp4 "$OUT"; fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ needs.plan.outputs.comp }}-final", path: "${{ needs.plan.outputs.comp }}.mp4", retention-days: 14 }
